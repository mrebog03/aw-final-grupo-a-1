<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Tareas - Planificador del viaje</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/assets/css/main.css">  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script type="module" src="./assets/js/tareas-main.js"></script>
    <script type="module" src="./assets/js/user-main.js"></script>
  </head>
  <body class="tareas-page">
    
    <header class="header-dashboard">
      <div class="header-top">
        <div class="logo-area">
          <img src="/assets/img/Bienvenida.png" alt="Logo">
        </div>
        <div class="tittle-area">
          <h1>Planifica tus viajes en grupo</h1>
        </div>
        <div class="user-area" id="userMenuBtn">
          <img src="/assets/img/userIcon.png" alt="Perfil de usuario">
          <div class="menu-desplegable">
            <a href="perfil.html"><i class="fa-solid fa-user"></i> Mi perfil</a>
            <hr>
            <a href="#" id="btn-logout" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</a>
          </div>
        </div>
      </div> 
      <nav class="menu-area">
        <ul id="main-menu"> 
          <li><a href="#" data-url="viajes.html"><i class="fa-solid fa-house"></i> Inicio</a></li>
          <li><a href="#" data-url="alojamientos.html"><i class="fa-solid fa-hotel"></i> Alojamientos</a></li>
          <li><a href="#" data-url="actividades.html"><i class="fa-solid fa-person-hiking"></i> Actividades</a></li>
          <li><a href="#" data-url="tareas.html" class="active"><i class="fa-solid fa-list-check"></i> Tareas</a></li>
          <li><a href="#" data-url="gastos.html"><i class="fa-solid fa-coins"></i> Gastos</a></li>
          <li><a href="#" data-url="detalles.html"><i class="fa-solid fa-magnifying-glass"></i> Detalles</a></li>
        </ul>
      </nav>
    </header>

    <main class="main-content">
      <div class="page-header">
        <h3><i class="fa-solid fa-list-check"></i> Gestión de Tareas</h3>
      </div>

      <div class="card">
        <details>
          <summary role="button" class="btn-primary"><i class="fa-solid fa-plus"></i> Añadir Tarea</summary>
          <form id="tarea-create" name="tarea-create" class="form-container">
            <fieldset>    
              <div class="grid">
                <select name="viaje" id="select-viaje" required>
                  <option value="" selected disabled>Asociar a viaje</option>
                </select>
                <input type="text" name="descripcion" placeholder="¿Qué hay que hacer? *" required>
                <select name="actividad" id="select-actividades" required>
                  <option value="" selected disabled>Asociar a actividad...</option>
                </select>
                <select name="completada" id="completada" required>
                  <option value="" selected disabled>Estado</option>
                  <option value="true">Completada</option>
                  <option value="false">Pendiente</option>
                </select>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn-success">
                  <i class="fa-solid fa-plus"></i> Crear tarea
                </button>
              </div>
            </fieldset>
          </form>
        </details>
      </div>

      <div class="buscar-tareas">
        <form id="tarea-search" name="tarea-search">
          <div class="grid">
            <select name="estado">
              <option value="">Todos los estados</option>
              <option value="pendiente">Pendientes</option>
              <option value="completada">Completadas</option>
            </select>
             <select name="viaje" id="select-viaje-filter">
              <option value="" selected disabled>Viajes disponibles...</option>
            </select>
            <button type="submit" class="contrast"><i class="fa-solid fa-search"></i> Buscar</button>
          </div>
        </form>
      </div>

      <div class="card table-card">
        <h2>Listado de tareas del viaje</h2>
        <div id="tareas-results">
           </div>
      </div>
    </main>  
  </body>
</html>
