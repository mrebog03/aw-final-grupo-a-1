<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Crear cuenta - Gestor de viajes en grupo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script type="module" src="./assets/js/user-main.js"></script>
  </head>
  <body class="auth-page">
    
    <!-- LADO IZQUIERDO: Branding y Bienvenida -->
    <div class="brand-container">
      <div class="brand-content">
        <h1>¡Planifica tus viajes en grupo!</h1>
        <p>Organiza, comparte y disfruta sin preocupaciones.</p>
        <img src="/assets/img/Bienvenida.png" alt="Emoticono relacionado con los viajes">
      </div>
    </div>

    <!-- LADO DERECHO: Formulario de Registro -->
    <div class="form-container-wrapper">
      <div class="login-container card">
        <div class="login-header">
          <h2>Crea tu cuenta</h2>
          <p>Únete y empieza a organizar tus viajes</p>
        </div>
        
        <form id="registroForm">
          <fieldset>
            <label for="nombre">
              Nombre completo *
              <input type="text" name="nombre" id="nombre" placeholder="Tu nombre" required>
            </label>
            
            <label for="email">
              Correo electrónico *
              <input type="email" name="email" id="email" placeholder="ejemplo@correo.com" required>
            </label>
            
            <!-- Usamos grid para poner las contraseñas en la misma línea y ahorrar espacio vertical -->
            <div class="grid">
              <label for="password">
                Contraseña *
                <input type="password" name="password" id="password" placeholder="••••••••" required>
              </label>
              
              <label for="confirmPassword">
                Confirmar *
                <input type="password" name="confirmPassword" id="confirmPassword" placeholder="••••••••" required>
              </label>
            </div>
            
            <button type="submit" class="btn-primary auth-btn">
              <i class="fa-solid fa-user-plus"></i> Crear cuenta
            </button>
          </fieldset>
        </form>
        
        <div class="auth-footer">
          <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        </div>
      </div>
    </div>

  </body>
</html>
